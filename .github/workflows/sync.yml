name: Sync packs
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-packs
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          PACK_SOURCE_BASE: ${{ vars.PACK_SOURCE_BASE }}
        run: node sync-packs.mjs
      - run: |
          if ! git diff --quiet -- packs catalog.json pack.json 2>/dev/null; then
            git config user.name "pack-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packs catalog.json
            git add -A -- pack.json
            git commit -m "sync packs"
            git push
          fi

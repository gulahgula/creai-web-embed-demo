name: Sync pack
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-pack
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -sS --fail --retry 4 --retry-delay 10 -m 120 "${{ vars.PACK_SOURCE_URL }}" -o pack.raw.json
      - run: node sanitize-pack.mjs pack.raw.json > pack.new.json
      - run: |
          if ! diff -q pack.json pack.new.json > /dev/null 2>&1; then
            mv pack.new.json pack.json
            git config user.name "pack-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pack.json
            git commit -m "sync pack"
            git push
          fi
          rm -f pack.raw.json pack.new.json
